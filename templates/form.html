{% extends "base.html" %}{% block title %}{{ title }}{% endblock %}
{% block content %}<div class="card-box" style="max-width:640px"><h3 class="mb-3">{{ title }}</h3>
<form method="post">
{% for f in fields %}<div class="mb-3"><label class="form-label">{{ f.label }}</label>
{% if f.type=='select' %}<select name="{{ f.name }}" class="form-select">{% for v,l in f.options %}<option value="{{ v }}" {{ 'selected' if vals.get(f.name)|string==v|string }}>{{ l }}</option>{% endfor %}</select>
{% elif f.type=='textarea' %}<textarea name="{{ f.name }}" class="form-control" rows="2">{{ vals.get(f.name) or '' }}</textarea>
{% else %}<input type="{{ f.type }}" name="{{ f.name }}" class="form-control" {% if f.step %}step="{{ f.step }}"{% endif %} value="{{ vals.get(f.name) if vals.get(f.name) is not none else '' }}" required>{% endif %}</div>{% endfor %}
<button class="btn btn-brand">Save</button> <a href="{{ back }}" class="btn btn-light">Cancel</a></form></div>{% endblock %}
