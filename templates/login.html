{% extends "base.html" %}{% block title %}Log in{% endblock %}
{% block content %}<div class="auth-card"><h3>Welcome back</h3><p class="text-muted">Log in to see where your money went this month.</p>
<form method="post">
<div class="mb-3"><label class="form-label">Email</label><input type="email" name="email" class="form-control" required></div>
<div class="mb-3"><label class="form-label">Password</label><input type="password" name="password" class="form-control" required></div>
<button class="btn btn-brand w-100 py-2">Log in</button></form>
<p class="mt-3 mb-0 text-center">New here? <a href="{{ url_for('register') }}">Create an account</a></p></div>{% endblock %}
