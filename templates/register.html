{% extends "base.html" %}{% block title %}Register{% endblock %}
{% block content %}<div class="auth-card"><h3>Create your account</h3><p class="text-muted">Start tracking income, spending and savings goals.</p>
<form method="post">
<div class="mb-3"><label class="form-label">Full name</label><input name="full_name" class="form-control" value="{{ form.get('full_name','') }}" required></div>
<div class="mb-3"><label class="form-label">Email</label><input type="email" name="email" class="form-control" value="{{ form.get('email','') }}" required></div>
<div class="mb-3"><label class="form-label">Password</label><input type="password" name="password" class="form-control" minlength="6" required></div>
<div class="mb-3"><label class="form-label">Confirm password</label><input type="password" name="confirm_password" class="form-control" required></div>
<button class="btn btn-brand w-100 py-2">Create account</button></form>
<p class="mt-3 mb-0 text-center">Already registered? <a href="{{ url_for('login') }}">Log in</a></p></div>{% endblock %}
